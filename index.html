<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles.css">
	<title>Document</title>
</head>
<body>

    <div class="main-container">
        <div class="player-profile">
            <div>Player 1</div>
            <div class="player-info">
                <input type="text" id="player-name" name="playerName" class="player1-info">
            </div>
            <div class="player-icon icon-x">X</div>

        </div>
        <div class="game-container">
            <h1 class="title">Tic Tac Toe</h1>
            <div class="game-grid">
                <div class="cell" id="0"></div>
                <div class="cell" id="1"></div>
                <div class="cell" id="2"></div>
                <div class="cell" id="3"></div>
                <div class="cell" id="4"></div>
                <div class="cell" id="5"></div>
                <div class="cell" id="6"></div>
                <div class="cell" id="7"></div>
                <div class="cell" id="8"></div>
            </div>
            
            <div class="turn-counter"></div>
            <div class="player-turn"></div>
            <div class="button-area">
                <button class="play-now-button">Start!</button>
                <button class="play-again-button hidden-button">Play Again!</button>
            </div>

        </div>
        <div class="player-profile">
            <div>Player2</div>
            <div class="player-info">
                <input type="text" id="player-name" name="playerName" class="player2-info">
            </div>

            <div class="player-icon icon-o">O</div>
        </div>

    </div>
    
    <script src="js/gameLogic.js" defer></script> 
</body>
</html>
